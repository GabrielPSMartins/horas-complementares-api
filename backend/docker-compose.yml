# Uso:
#   docker compose up -d                 -> só a infraestrutura (PostgreSQL, pgAdmin, MinIO);
#                                           a API e o frontend rodam localmente (ver README)
#   docker compose --profile app up -d   -> tudo em containers, inclusive API e frontend
# As variáveis vêm do arquivo .env (copie de .env.example).

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: horas_complementares_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - horas_complementares_network

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: horas_complementares_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - horas_complementares_network

  minio:
    # A MinIO deixou de publicar as imagens da edição comunitária (minio/minio
    # não pode mais ser baixada). pgsty/minio é um fork comunitário mantido,
    # compatível com o mesmo comando, variáveis e formato de dados.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: horas_complementares_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Mesmas credenciais que a API usa para acessar o MinIO.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - horas_complementares_network

  api:
    profiles: ["app"]
    build: .
    container_name: horas_complementares_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro da rede do Docker, os serviços são acessados pelo nome.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      # Endereço usado nos links de download abertos pelo navegador.
      MINIO_PUBLIC_ENDPOINT: localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - horas_complementares_network

  frontend:
    profiles: ["app"]
    image: nginx:1.27-alpine
    container_name: horas_complementares_frontend
    restart: unless-stopped
    volumes:
      # Servido em /frontend/, como exigem os caminhos absolutos das páginas.
      - ../frontend:/usr/share/nginx/html/frontend:ro
    ports:
      - "5500:80"
    networks:
      - horas_complementares_network

volumes:
  postgres_data:
  minio_data:

networks:
  horas_complementares_network:
    driver: bridge
