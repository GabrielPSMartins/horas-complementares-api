<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Horas Complementares</title>
    
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/componentes.css">
    
    <!-- Ícones e Biblioteca de Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>   
</head>
<body>

    <div class="app-layout">
        <!-- SIDEBAR ESQUERDA -->
        <aside class="app-sidebar">
            <!-- TOPO DA SIDEBAR -->
            <div class="brand-header">
                <div class="brand-icon">
                    <i data-lucide="graduation-cap"></i>
                </div>
                <div class="brand-text">
                    <h2>Horas Complementares</h2>
                    <p>Sist. de Informação · FEPI</p>
                </div>
            </div>
            <nav class="nav-menu">
                <span class="nav-label">MENU</span>
    
                <a href="dashboards.html" class="nav-item active">
                    <i data-lucide="layout-grid"></i>
                    <span>Dashboards</span>
                </a>
    
                <a href="solicitacoes.html" class="nav-item">
                    <i data-lucide="file-check"></i>
                    <span>Solicitações</span>
                </a>
    
                <a href="alunos.html" class="nav-item">
                    <i data-lucide="users"></i>
                    <span>Alunos</span>
                </a>
    
                <a href="relatorios.html" class="nav-item">
                 <i data-lucide="chart-column"></i>
                    <span>Relatórios</span>
                </a>
            </nav>
            <!-- RODAPÉ DA SIDEBAR -->
            <div class="sidebar-footer">
                <div class="sidebar-user-card">
                    <div class="avatar-circle sidebar-avatar" id="sidebar-avatar">--</div>
                    <div class="sidebar-user-info">
                        <h4 id="sidebar-user-name">Carregando...</h4>
                        <p id="sidebar-user-role">Coordenador</p>
                    </div>
                </div>

                <a href="perfil.html" class="nav-item">
                    <i data-lucide="user"></i>
                    <span>Perfil</span>
                </a>
                <button id="btn-logout" class="nav-item btn-link-logout" style="background:none; border:none; width:100%; text-align:left; cursor:pointer;">
                    <i data-lucide="log-out"></i>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <main class="app-main">
            <!-- Header superior  -->
            <header class="app-header">
                <div class="header-title">
                    <h1>Dashboard</h1>
                    <p>Olá, <span id="header-user-firstname">...</span>! Acompanhe os progressos dos seus alunos.</p>
                </div>
                <div class="flex-align-center">
                    <div class="avatar-circle small" id="top-avatar">--</div>
                    <div>
                        <div class="stat-label" id="top-user-name">Carregando...</div>
                        <div class="stat-sub">Coordenador</div>
                    </div>
                </div>
            </header>

    <script type="module" src="../../js/pages/coordenador/dashboards.js"></script>

    <!-- INICIALIZAÇÃO DOS ÍCONES LUCIDE -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
